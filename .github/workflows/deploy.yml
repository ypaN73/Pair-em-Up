name: Deploy to GitHub Pages

on:
  push:
    branches: [pair-em-up]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Debug - Check project structure
      run: |
        echo "=== Project structure ==="
        find . -name "package.json" -o -name "vite.config.js" | head -10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'pair-em-up/package-lock.json'

    - name: Install dependencies
      run: |
        cd pair-em-up
        echo "=== Before install ==="
        ls -la
        npm ci

    - name: Build project
      run: |
        cd pair-em-up
        echo "=== Before build ==="
        npm run build
        echo "=== After build ==="
        ls -la dist/ || echo "dist folder not created"

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: pair-em-up/dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4